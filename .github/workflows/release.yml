name: Android Release CI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve Version from Git Tag
        run: |
          # Git Tag（如 v1.2.3）是版本号的唯一来源；解析出的结果通过 GITHUB_ENV
          # 供后续构建 / update.json 步骤使用，不修改仓库内的任何配置文件。
          VERSION=${GITHUB_REF_NAME#v}
          if [[ ! $VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME 不符合 vx.y.z 格式，拒绝构建。"
            exit 1
          fi
          MAJOR=${BASH_REMATCH[1]}
          MINOR=${BASH_REMATCH[2]}
          PATCH=${BASH_REMATCH[3]}
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          # 单调递增保证：versionCode 必须严格大于所有历史版本的 versionCode。
          # 遍历 git 已存在的 tags（排除当前 tag），取历史最大版本码 + 1；
          # 若当前 tag 按公式算出的值更大则优先使用当前值，从而兼容
          # 既有版本（v1.0.x 已使用 major*10000+minor*100+patch 发布过 10001~10004）。
          PREV_MAX=0
          for TAG in $(git tag --list 'v[0-9]*' 2>/dev/null); do
            [ "$TAG" = "$GITHUB_REF_NAME" ] && continue
            TV=${TAG#v}
            if [[ $TV =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              CODE=$(( ${BASH_REMATCH[1]} * 10000 + ${BASH_REMATCH[2]} * 100 + ${BASH_REMATCH[3]} ))
              if [ "$CODE" -gt "$PREV_MAX" ]; then PREV_MAX=$CODE; fi
            fi
          done
          if [ "$VERSION_CODE" -le "$PREV_MAX" ]; then
            echo "    Formula($VERSION_CODE) <= historical max($PREV_MAX), bumping to $((PREV_MAX + 1))"
            VERSION_CODE=$((PREV_MAX + 1))
          fi

          echo "    versionName=$VERSION"
          echo "    versionCode=$VERSION_CODE"
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build with Gradle
        run: ./gradlew assembleRelease -PRBOOK_VERSION_NAME="$VERSION_NAME" -PRBOOK_VERSION_CODE="$VERSION_CODE"

      - name: Manual Sign APK
        env:
          # 通过 env 注入当前 step，避免在 shell 命令行直接拼入 secrets
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "==> 1/5 定位待签名 APK"
          APK_DIR="app/build/outputs/apk/release"
          # 只取 release 目录下的 APK，并排除已签名文件，避免误选
          RAW_APK=$(ls -1 "$APK_DIR"/*.apk 2>/dev/null | grep -v -- '-signed\.apk$' | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "::error::未在 $APK_DIR 下找到待签名 APK"
            exit 1
          fi
          echo "    RAW_APK=$RAW_APK"

          echo "==> 2/5 定位 build-tools (zipalign / apksigner / keytool)"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          # 按版本号升序取最新一个 build-tools 目录，保证稳定找到工具
          BUILD_TOOLS_PATH=$(ls -d "$SDK_ROOT"/build-tools/*/ 2>/dev/null | sort -V | tail -n 1 | sed 's#/$##')
          if [ -z "$BUILD_TOOLS_PATH" ] || [ ! -x "$BUILD_TOOLS_PATH/apksigner" ]; then
            echo "::error::未在 $SDK_ROOT/build-tools 下找到 apksigner"
            exit 1
          fi
          echo "    BUILD_TOOLS=$BUILD_TOOLS_PATH"

          echo "==> 3/5 从 SIGNING_KEY 临时恢复 Keystore"
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::SIGNING_KEY 为空"
            exit 1
          fi
          # 展开换行后用 base64 解码，兼容 Secret 中存多行 base64 的情况
          printf '%s\n' "$SIGNING_KEY" | tr -d '\r' | base64 -d > release.jks
          # 脚本结束（成功或失败）时自动删除临时 Keystore
          trap 'rm -f release.jks' EXIT

          echo "==> 4/5 校验 Secrets 与 Keystore，先行诊断（便于区分是密码问题还是内容问题）"
          [ -n "$KEY_STORE_PASSWORD" ] || { echo "::error::KEY_STORE_PASSWORD 为空"; exit 1; }
          [ -n "$KEY_PASSWORD" ] || { echo "::error::KEY_PASSWORD 为空"; exit 1; }

          # 用 keytool -list 验证 store 密码是否匹配；失败即能明确指向 KEY_STORE_PASSWORD
          if command -v keytool >/dev/null 2>&1; then
            if keytool -list -keystore release.jks -storepass "$KEY_STORE_PASSWORD" -storetype PKCS12 >/dev/null 2>&1 \
               || keytool -list -keystore release.jks -storepass "$KEY_STORE_PASSWORD" -storetype JKS >/dev/null 2>&1; then
              echo "    [OK] KEY_STORE_PASSWORD 与 Keystore 匹配"
            else
              echo "::error::KEY_STORE_PASSWORD 无法打开 Keystore（密码不匹配或 Keystore 内容损坏）"
              echo "    - 请核对 GitHub Secrets 中的 KEY_STORE_PASSWORD 是否与创建 Keystore 时的密码完全一致（含空格）。"
              echo "    - 请核对 SIGNING_KEY 是否是对同一个 .jks 文件 base64 编码的结果。"
              echo "    - 若本地 Keystore 是 JKS 格式，无需强制为 PKCS12（本流程已自动探测）。"
              ls -l release.jks
              exit 1
            fi
          fi

          # apksigner 直接加载文件会自动识别 Keystore 类型（JKS / PKCS12），
          # 因此这里不指定 --ks-type，避免格式强制导致的“假密码”错误。

          echo "==> 5/5 zipalign + apksigner 签名"
          "$BUILD_TOOLS_PATH/zipalign" -v 4 "$RAW_APK" app-release-aligned.apk

          "$BUILD_TOOLS_PATH/apksigner" sign \
            --ks release.jks \
            --ks-key-alias "key0" \
            --ks-pass "pass:${KEY_STORE_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out app-release-signed.apk \
            app-release-aligned.apk

          # 验证签名产物；verify 失败时整个 step 返回非零，Workflow 即失败
          "$BUILD_TOOLS_PATH/apksigner" verify --verbose --print-certs app-release-signed.apk

          ls -lh app-release-signed.apk

      - name: Create GitHub Release
        run: |
          if gh release view ${{ github.ref_name }} > /dev/null 2>&1; then
            gh release upload ${{ github.ref_name }} app-release-signed.apk --clobber
          else
            gh release create ${{ github.ref_name }} app-release-signed.apk \
              --title "Release ${{ github.ref_name }}" \
              --notes "自动构建并签名的正式版本。"
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Deploy to Release Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          mkdir -p deploy_dir
          cp app-release-signed.apk deploy_dir/rbook-latest.apk
          CDN_URL="https://fastly.jsdelivr.net/gh/${{ github.repository }}@release-bin/rbook-latest.apk"
          # App 内更新检查读取此稳定 JSON 契约：versionCode 用于严格数值比较，
          # remoteVersionCode > BuildConfig.VERSION_CODE 时才提示更新。
          printf '{"version":"%s","versionCode":%d,"url":"%s","notes":"自动构建并签名的正式版本。"}\n' \
            "$VERSION_NAME" "$VERSION_CODE" "$CDN_URL" > deploy_dir/update.json
          cd deploy_dir
          
          git init
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          
          git checkout -b release-bin
          git add rbook-latest.apk
          git commit -m "release: update signed apk to ${GITHUB_REF_NAME}"
          git push origin release-bin --force
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Dispatch to Blog Repo
        env:
          # 通过 env 注入，避免在 shell 命令行直接展开 secrets
          BLOG_REPO_TOKEN: ${{ secrets.BLOG_REPO_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          CDN_URL="https://fastly.jsdelivr.net/gh/${{ github.repository }}@release-bin/rbook-latest.apk"
          
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${BLOG_REPO_TOKEN}" \
            https://api.github.com/repos/duibuqi-woyaoqifei/jinlun-blog/dispatches \
            -d "{\"event_type\": \"version_update\", \"client_payload\": {\"version\": \"$VERSION\", \"url\": \"$CDN_URL\"}}"
